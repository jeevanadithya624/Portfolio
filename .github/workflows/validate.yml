name: Validate HTML & CSS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g htmlhint
          npm install -g stylelint@16

      - name: Validate HTML files
        run: htmlhint "*.html" --config .htmlhintrc

      # theme.css may contain colours; style.css must not (enforced in .stylelintrc.json).
      # stylelint is used instead of CSSLint because CSSLint cannot parse CSS variables.
      - name: Validate CSS files
        run: stylelint "css/*.css" --config .stylelintrc.json
