name: Deployment Notification

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Add SLACK_WEBHOOK_URL under Settings > Secrets and variables > Actions.
      # If it is missing the job still passes and only logs the message.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify on success
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "Deployment successful! Site live at: $SITE_URL"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Profile site deployed: $SITE_URL\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Notify on failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: |
          echo "Deployment FAILED! Check the Actions tab: ${{ github.event.workflow_run.html_url }}"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Profile site deployment failed. ${{ github.event.workflow_run.html_url }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
